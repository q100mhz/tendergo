# Caps container logs so a long-running VPS does not fill its disk.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  db:
    image: postgres:17-alpine
    restart: unless-stopped
    logging: *logging
    environment:
      POSTGRES_DB: tendergo
      POSTGRES_USER: tendergo
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tendergo -d tendergo"]
      interval: 5s
      retries: 20

  api:
    build: { context: ., target: api }
    restart: unless-stopped
    logging: *logging
    env_file: .env
    environment:
      DATABASE_URL: postgres://tendergo:${POSTGRES_PASSWORD}@db:5432/tendergo
      BASE_PATH: ${BASE_PATH:-/tendergo}
      PUBLIC_URL: https://${DOMAIN:?set DOMAIN in .env}${BASE_PATH:-/tendergo}
    depends_on:
      db: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 10s
      retries: 10

  # Runs hourly ingestion from zakupki.gov.ru; starts after api has applied migrations.
  worker:
    build: { context: ., target: api }
    restart: unless-stopped
    logging: *logging
    command: ["node", "dist/worker.js"]
    env_file: .env
    environment:
      DATABASE_URL: postgres://tendergo:${POSTGRES_PASSWORD}@db:5432/tendergo
      BASE_PATH: ${BASE_PATH:-/tendergo}
    depends_on:
      api: { condition: service_healthy }

  # Site and API on 127.0.0.1:WEB_PORT only; nginx on the host proxies https://DOMAIN/tendergo here.
  web:
    build:
      context: .
      target: web
      args:
        BASE_PATH: ${BASE_PATH:-/tendergo}
    restart: unless-stopped
    logging: *logging
    environment:
      BASE_PATH: ${BASE_PATH:-/tendergo}
    ports:
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      - api

volumes:
  pgdata:

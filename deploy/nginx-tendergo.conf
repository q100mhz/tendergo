# Paste inside the existing `server { ... }` block of itb2bhost.ru that has `listen 443 ssl`.
# `^~` keeps regex locations (e.g. static-file caching rules of the main site) from catching /tendergo URLs.
# The port must match WEB_PORT in .env. Apply with: sudo nginx -t && sudo systemctl reload nginx
location ^~ /tendergo {
    proxy_pass http://127.0.0.1:8090;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    # Overwrite rather than append, so visitors cannot spoof their IP for login rate limiting.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    client_max_body_size 1m;
}
